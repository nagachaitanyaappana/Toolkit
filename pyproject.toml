[project]
name = "toolkit"
version = "1.0.0"
description = "Interactive terminal toolkit with utilities, system tools, and more"
requires-python = ">=3.10"
dependencies = [
    "PyQt6",
    "cryptography",
    "yt-dlp",
    "rich",
    "questionary",
    "phonenumbers",
    "qrcode[terminal]",
    "psutil",
    "requests",
    "pyperclip",
    "Pillow",
    "spotdl",
    "truecallerpy",
]

[project.optional-dependencies]
email = ["secure-smtpd"]
dev = ["pytest"]

[project.scripts]
toolkit = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "tools*", "ui*", "utils*"]
